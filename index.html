<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Заявление на отпуск</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    font-family: "Proxima Nova Inner", Arial, Helvetica, sans-serif;
    background: #f4f6f8;
    padding: 40px 20px;
    margin: 0;
}

.container {
    max-width: 520px;
    margin: 0 auto;
    background: #ffffff;
    padding: 32px;
    border-radius: 14px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.06);
}

h2 {
    margin-bottom: 24px;
    font-weight: 600;
    font-size: 22px;
}

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 6px;
    font-weight: 500;
    font-size: 14px;
}

select, input {
    width: 100%;
    padding: 11px 12px;
    border-radius: 8px;
    border: 1px solid #d6d9de;
    font-size: 14px;
    font-family: inherit;
    box-sizing: border-box;
    transition: border 0.2s ease;
}

select:focus, input:focus {
    outline: none;
    border-color: #2e7dff;
}

button {
    margin-top: 28px;
    width: 100%;
    padding: 13px;
    background: rgb(139, 54, 110);
    border: none;
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.05s ease;
}

button:hover {
    background: rgb(118, 42, 92);
}

button:active {
    transform: scale(0.98);
}
</style>
</head>
<body>

<div class="container">
<h2>Сформировать заявление на отпуск</h2>

<label>Вид отпуска</label>
<select id="type">
<option value="paid">Ежегодный оплачиваемый отпуск</option>
<option value="unpaid">Отпуск без сохранения заработной платы</option>
</select>

<label>Дата начала</label>
<input type="date" id="start">

<label>Дата окончания</label>
<input type="date" id="end">

<button onclick="generateDoc()">Скачать заявление</button>

<div class="note">
Шапку (кому и от кого) вы заполните самостоятельно в документе.
</div>
</div>

<!-- СТАБИЛЬНОЕ подключение docx -->
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>

<script>
function formatDate(date) {
    const months = [
        "января","февраля","марта","апреля","мая","июня",
        "июля","августа","сентября","октября","ноября","декабря"
    ];
    return date.getDate() + " " + months[date.getMonth()] + " " + date.getFullYear() + " г.";
}

function calculateDays(start, end) {
    const diff = end - start;
    return Math.floor(diff / (1000 * 60 * 60 * 24)) + 1;
}

async function generateDoc() {

    if (!window.docx) {
        alert("Библиотека docx не загрузилась. Попробуйте обновить страницу.");
        return;
    }

    const { Document, Packer, Paragraph, TextRun, AlignmentType } = window.docx;

    const type = document.getElementById("type").value;
    const startValue = document.getElementById("start").value;
    const endValue = document.getElementById("end").value;

    if (!startValue || !endValue) {
        alert("Пожалуйста, заполните даты.");
        return;
    }

    const startDate = new Date(startValue);
    const endDate = new Date(endValue);

    if (endDate < startDate) {
        alert("Дата окончания не может быть раньше даты начала.");
        return;
    }

    const days = calculateDays(startDate, endDate);
    const today = new Date();

    const leaveText = type === "paid"
        ? "ежегодный оплачиваемый отпуск"
        : "отпуск без сохранения заработной платы";

    const doc = new Document({
        sections: [{
            children: [

                // Шапка справа
                new Paragraph({
                    alignment: AlignmentType.RIGHT,
                    children: [new TextRun("Руководителю ____________________")]
                }),
                new Paragraph({
                    alignment: AlignmentType.RIGHT,
                    children: [new TextRun("от ______________________________")]
                }),

                new Paragraph({ text: "" }),

                // Заголовок
                new Paragraph({
                    alignment: AlignmentType.CENTER,
                    children: [
                        new TextRun({
                            text: "ЗАЯВЛЕНИЕ",
                            bold: true,
                            size: 32
                        })
                    ]
                }),

                new Paragraph({ text: "" }),

                // Основной текст
                new Paragraph({
                    children: [
                        new TextRun(
                            "Прошу предоставить мне " + leaveText +
                            " продолжительностью " + days +
                            " календарных дней с " +
                            formatDate(startDate) + " по " +
                            formatDate(endDate) + "."
                        )
                    ]
                }),

                new Paragraph({ text: "" }),
                new Paragraph({ text: "" }),

                // Дата
                new Paragraph({
                    children: [
                        new TextRun(formatDate(today))
                    ]
                }),

                new Paragraph({
                    children: [
                        new TextRun("Подпись ____________________")
                    ]
                })
            ]
        }]
    });

    const blob = await Packer.toBlob(doc);

    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "Заявление_на_отпуск.docx";
    link.click();
}
</script>

</body>
</html>
